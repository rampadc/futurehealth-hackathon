[project]
name = "future-health-hackathon"
version = "0.1.0"
description = "Heat-Safe Crew Agent: heat-stress early warning and shift planning for outdoor crews in Abu Dhabi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.9.0",
    "google-adk>=2.13.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-bigquery-storage>=2.43.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "thermofeel==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heat_safe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
